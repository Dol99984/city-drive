<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>City Drive 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87b6d8;touch-action:none;font-family:Arial}canvas{display:block}
#hud{position:fixed;top:10px;left:10px;z-index:2;color:white;display:flex;gap:7px;flex-wrap:wrap}.c{background:#000b;padding:8px 10px;border-radius:9px}
#touch{position:fixed;bottom:12px;left:0;right:0;z-index:3;text-align:center}.r{margin:6px}.b{width:68px;height:58px;margin:4px;border:1px solid #fff5;border-radius:15px;background:#000b;color:white;font-size:24px;font-weight:bold}.g{background:#176c3ccc}
#start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#09111dcc;color:white}.p{background:#111e;padding:28px;border-radius:18px;width:min(520px,85vw)}button.play{padding:12px 22px;border:0;border-radius:10px;font-weight:bold}
@media(min-width:901px){#touch{display:none}}
</style></head><body>
<div id="hud"><div class="c">💵 $<span id="money">0</span></div><div class="c">⭐ <span id="wanted">0</span>/5</div><div class="c">❤️ <span id="hp">100</span></div></div>
<div id="touch"><div class="r"><button class="b" id="l">◀</button><button class="b" id="br">▼</button><button class="b" id="rr">▶</button></div><div class="r"><button class="b g" id="go">▲</button><button class="b" id="hb">⏺</button></div></div>
<div id="start"><div class="p"><h1>City Drive 3D</h1><p>Explore an original 3D city, drive around, complete missions and escape police.</p><button class="play" id="play">PLAY 3D</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
const S=new T.Scene();S.background=new T.Color(0x87b6d8);S.fog=new T.Fog(0x87b6d8,80,330);
const C=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,500),R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
S.add(new T.HemisphereLight(0xbfe5ff,0x405040,2));let sun=new T.DirectionalLight(0xffffff,2);sun.position.set(60,100,40);sun.castShadow=true;S.add(sun);
const box=(w,h,d,m,x,y,z)=>{let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;S.add(o);return o},mat=c=>new T.MeshStandardMaterial({color:c});
box(1800,.5,1800,mat(0x416846),0,-.3,0);
for(let x=-810;x<=810;x+=180)box(34,.12,1800,mat(0x303236),x,0,0);
for(let z=-810;z<=810;z+=180)box(1800,.12,34,mat(0x303236),0,0,z);
let cols=[0x777c82,0x66705f,0x8b8178,0x5e6872];
for(let x=-720;x<=720;x+=180)for(let z=-720;z<=720;z+=180){let h=14+Math.random()*55;box(60+Math.random()*40,h,60+Math.random()*40,mat(cols[(Math.random()*4)|0]),x+55,h/2,z+55)}
function car(color,police=false){let g=new T.Group();let b=new T.Mesh(new T.BoxGeometry(6,1.5,11),mat(color));b.position.y=1.35;g.add(b);let w=new T.Mesh(new T.BoxGeometry(4.8,1.4,5.5),mat(0x18242d));w.position.y=2.25;g.add(w);for(let x of[-3.1,3.1])for(let z of[-3.5,3.5]){let q=new T.Mesh(new T.CylinderGeometry(1,1,.65,12),mat(0x111111));q.rotation.z=Math.PI/2;q.position.set(x,1,z);g.add(q)}if(police){let q=new T.Mesh(new T.BoxGeometry(2,.3,.8),mat(0x3777ff));q.position.y=3.1;g.add(q)}S.add(g);return g}
const p={x:0,z:0,a:0,v:0,hp:100,money:0,w:0},pc=car(0xd84d4d);let traffic=[],cops=[];
for(let i=0;i<18;i++){let g=car([0x3972c9,0xe0a832,0xeeeeee,0x6c56a8][i%4]),v=Math.random()<.5;g.position.set(v?Math.round((Math.random()*8-4))*180:Math.random()*1600-800,0,v?Math.random()*1600-800:Math.round((Math.random()*8-4))*180);g.rotation.y=v?Math.PI/2:0;traffic.push({g,v,s:12+Math.random()*10})}
let target=new T.Vector3(540,0,360),mk=new T.Mesh(new T.CylinderGeometry(8,8,.25,24),new T.MeshBasicMaterial({color:0x42ff86,transparent:true,opacity:.7}));mk.position.copy(target);mk.position.y=.2;S.add(mk);
const k={};addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{k[e.key.toLowerCase()]=0});
function bind(id,key){let e=document.getElementById(id);let on=x=>{x.preventDefault();k[key]=1},off=x=>{x.preventDefault();k[key]=0};e.addEventListener('pointerdown',on,{passive:false});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,off,{passive:false}))}
bind('l','a');bind('rr','d');bind('go','w');bind('br','s');bind('hb',' ');
document.getElementById('play').onclick=()=>document.getElementById('start').style.display='none';
function spawn(){let g=car(0xffffff,true),a=Math.random()*6.28,r=110;g.position.set(p.x+Math.cos(a)*r,0,p.z+Math.sin(a)*r);cops.push(g)}
function loop(t){requestAnimationFrame(loop);let dt=.016;
let a=(k.w?24:0)-(k.s?16:0);p.v+=a*dt;if(!a)p.v*=.92;p.v=Math.max(-10,Math.min(28,p.v));let st=(k.a?-1:0)+(k.d?1:0);p.a+=st*dt*(.8+Math.abs(p.v)/12);if(k[' '])p.v*=.75;
p.x+=Math.sin(p.a)*p.v*dt;p.z+=Math.cos(p.a)*p.v*dt;p.x=Math.max(-870,Math.min(870,p.x));p.z=Math.max(-870,Math.min(870,p.z));pc.position.set(p.x,0,p.z);pc.rotation.y=p.a;
traffic.forEach(q=>{q.g.position.x+=Math.sin(q.g.rotation.y)*q.s*dt;q.g.position.z+=Math.cos(q.g.rotation.y)*q.s*dt;if(Math.abs(q.g.position.x)>900||Math.abs(q.g.position.z)>900){q.g.position.x=Math.random()*1600-800;q.g.position.z=Math.random()*1600-800}});
if(p.w>.2&&Math.random()<dt*.18)spawn();p.w=Math.max(0,p.w-dt*.01);
cops.forEach(g=>{let dx=p.x-g.position.x,dz=p.z-g.position.z;g.rotation.y=Math.atan2(dx,dz);g.position.x+=Math.sin(g.rotation.y)*(16+p.w*2)*dt;g.position.z+=Math.cos(g.rotation.y)*(16+p.w*2)*dt;if(g.position.distanceTo(pc.position)<8){p.hp-=10*dt;p.w=Math.min(5,p.w+.05)}});
if(pc.position.distanceTo(mk.position)<18){p.money+=500;p.w=Math.min(5,p.w+1);target.set(Math.round(Math.random()*8-4)*180,0,Math.round(Math.random()*8-4)*180);mk.position.copy(target);mk.position.y=.2}
if(pc.position.distanceTo(mk.position)<18){}if(p.hp<0)p.hp=100;
C.position.lerp(new T.Vector3(p.x-Math.sin(p.a)*24,14,p.z-Math.cos(p.a)*24),.12);C.lookAt(p.x,2,p.z);R.render(S,C);
document.getElementById('money').textContent=Math.floor(p.money);document.getElementById('wanted').textContent=Math.ceil(p.w);document.getElementById('hp').textContent=Math.ceil(p.hp)}
requestAnimationFrame(loop);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
